<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Resale & Exchange</title>
    <meta name="description" content="A verified college marketplace to buy, sell, and exchange pre-owned student gear, textbooks, and equipment with AI item inspection and Google Calendar handover scheduling." />
    <meta property="og:title" content="Campus Resale & Exchange" />
    <meta property="og:description" content="A verified college marketplace to buy, sell, and exchange pre-owned student gear, textbooks, and equipment with AI item inspection and Google Calendar handover scheduling." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress benign development-mode iframe cross-origin frame property inspection errors
      window.addEventListener(
        "error",
        function (event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || "";
          if (
            typeof msg === "string" &&
            (msg.includes("$$typeof") ||
              msg.includes("cross-origin frame") ||
              msg.includes("Should not already be working"))
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        },
        true
      );
      window.addEventListener(
        "unhandledrejection",
        function (event) {
          var reason = (event && (event.reason ? event.reason.message || String(event.reason) : "")) || "";
          if (
            typeof reason === "string" &&
            (reason.includes("$$typeof") ||
              reason.includes("cross-origin frame") ||
              reason.includes("Should not already be working"))
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <script>
      // Apply saved or preferred theme synchronously before first paint to prevent light/dark flash
      (function () {
        try {
          var saved = localStorage.getItem("campus_marketplace_theme");
          var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = saved === "light" || saved === "dark" ? saved : prefersLight ? "light" : "dark";
          var root = document.documentElement;
          root.classList.add(theme);
          root.classList.remove(theme === "dark" ? "light" : "dark");
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <!-- Google API Client for Google Picker -->
    <script src="https://apis.google.com/js/api.js" async defer></script>
  </head>
  <body class="min-h-screen antialiased bg-slate-100 dark:bg-[#0B0F19] text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
